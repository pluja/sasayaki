name: Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          # The default also installs "tools", which the SDK repository no longer offers.
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      # F-Droid builds the tag from the literals in app/build.gradle.kts, so a tag that
      # disagrees with them would ship two different versions under one name.
      - name: Check tag matches versionName
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version_name=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts)
          if [ "$version_name" != "$TAG" ]; then
            echo "Tag $TAG does not match versionName $version_name in app/build.gradle.kts; run make bump first." >&2
            exit 1
          fi

      - name: Format, lint and test
        run: ./gradlew spotlessCheck lintDebug testDebugUnitTest

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Sign release APK
        env:
          TAG: ${{ github.ref_name }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          SASAYAKI_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          SASAYAKI_KEYSTORE: ${{ runner.temp }}/release.jks
        run: |
          trap 'rm -f "$SASAYAKI_KEYSTORE"' EXIT
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$SASAYAKI_KEYSTORE"
          scripts/sign-release.sh app/build/outputs/apk/release/app-release-unsigned.apk "sasayaki-$TAG.apk"

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: sasayaki-${{ github.ref_name }}.apk
          generate_release_notes: true
